# Add/merge these into your project's pubspec.yaml, then run:
#   flutter pub get
#   dart run build_runner build --delete-conflicting-outputs

dependencies:
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local database
  drift: ^2.20.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Camera / ML (wired up in later phases, listed now so pubspec is future-ready)
  camera: ^0.11.0+2
  tflite_flutter: ^0.11.0

  # Connectivity for optional sync only
  connectivity_plus: ^6.0.3

  # Routing
  go_router: ^14.2.0

  # Contact actions (call / WhatsApp deep links)
  url_launcher: ^6.3.1

  # Sharing generated cartouches (WhatsApp, Instagram, etc.)
  share_plus: ^10.0.2

dev_dependencies:
  build_runner: ^2.4.11
  drift_dev: ^2.20.1
  riverpod_generator: ^2.4.0

  # Testing
  mocktail: ^1.0.3
